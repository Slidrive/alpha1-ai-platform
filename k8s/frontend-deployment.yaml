apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha1-frontend
  namespace: default
  labels:
    app: alpha1-frontend
    component: frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alpha1-frontend
  template:
    metadata:
      labels:
        app: alpha1-frontend
        component: frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: alpha1-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: alpha1-frontend-config
              key: api-url
        - name: REACT_APP_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: alpha1-frontend-config
              key: environment
        - name: REACT_APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: alpha1-frontend-config
              key: app-version
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101  # nginx user
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: alpha1-frontend-service
  namespace: default
  labels:
    app: alpha1-frontend
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: alpha1-frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alpha1-frontend-config
  namespace: default
  labels:
    app: alpha1-frontend
data:
  api-url: "http://alpha1-backend-service"
  environment: "production"
  app-version: "1.0.0"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alpha1-ingress
  namespace: default
  labels:
    app: alpha1
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=60
      routing.http2.enabled=true
      access_logs.s3.enabled=true
      access_logs.s3.bucket=alpha1-ai-platform-logs
      access_logs.s3.prefix=alb-access-logs
spec:
  rules:
  - host: alpha1.example.com  # Replace with your domain
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alpha1-backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpha1-frontend-service
            port:
              number: 80
  tls:
  - hosts:
    - alpha1.example.com  # Replace with your domain
    secretName: alpha1-tls-secret
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alpha1-frontend-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: alpha1-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system  # Allow ALB controller
    - podSelector: {}  # Allow from any pod in the same namespace
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: alpha1-backend
    ports:
    - protocol: TCP
      port: 80
  - to: []  # Allow DNS
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alpha1-frontend-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alpha1-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alpha1-frontend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alpha1-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: v1
kind: Secret
metadata:
  name: alpha1-tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  # Replace with your actual TLS certificate and key (base64 encoded)
  # tls.crt: LS0tLS1CRUdJTi...
  # tls.key: LS0tLS1CRUdJTi...
  tls.crt: ""
  tls.key: ""