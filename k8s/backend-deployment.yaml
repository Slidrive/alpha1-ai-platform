apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha1-backend
  namespace: default
  labels:
    app: alpha1-backend
    component: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alpha1-backend
  template:
    metadata:
      labels:
        app: alpha1-backend
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alpha1-app
      containers:
      - name: backend
        image: alpha1-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: alpha1-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: alpha1-secrets
              key: redis-url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: alpha1-secrets
              key: jwt-secret-key
        - name: AWS_DEFAULT_REGION
          valueFrom:
            configMapKeyRef:
              name: alpha1-config
              key: aws-region
        - name: S3_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: alpha1-config
              key: s3-bucket-name
        - name: CLOUDWATCH_LOG_GROUP
          valueFrom:
            configMapKeyRef:
              name: alpha1-config
              key: cloudwatch-log-group
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: alpha1-backend-service
  namespace: default
  labels:
    app: alpha1-backend
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: alpha1-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha1-app
  namespace: default
  labels:
    app: alpha1
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/alpha1-ai-platform-app-service-account-role"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alpha1-config
  namespace: default
  labels:
    app: alpha1
data:
  aws-region: "us-west-2"
  s3-bucket-name: "alpha1-ai-platform-app-data"
  cloudwatch-log-group: "/aws/alpha1-ai-platform/application"
  environment: "production"
  log-level: "INFO"
  max-workers: "4"
  worker-timeout: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: alpha1-secrets
  namespace: default
  labels:
    app: alpha1
type: Opaque
data:
  # These values should be base64 encoded
  # Example: echo -n "your-secret-value" | base64
  database-url: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bsb2NhbGhvc3Q6NTQzMi9kYg==  # postgresql://user:pass@localhost:5432/db
  redis-url: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==  # redis://localhost:6379
  jwt-secret-key: eW91ci1qd3Qtc2VjcmV0LWtleQ==  # your-jwt-secret-key
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alpha1-backend-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: alpha1-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: alpha1-frontend
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # HTTPS
    - protocol: TCP
      port: 80    # HTTP
    - protocol: UDP
      port: 53    # DNS
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alpha1-backend-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alpha1-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alpha1-backend-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alpha1-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max