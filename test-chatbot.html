<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-container { max-width: 600px; margin: 0 auto; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .assistant { background: #f5f5f5; }
        input { width: 70%; padding: 10px; }
        button { padding: 10px 20px; }
        .status { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>🤖 Alpha 1 AI Chatbot Test</h1>
        <div id="messages"></div>
        <div>
            <input type="text" id="messageInput" placeholder="Ask me about Alpha 1 AI Platform..." />
            <button onclick="sendMessage()">Send</button>
        </div>
        <div id="status" class="status">Ready to chat!</div>
    </div>

    <script>
        class TestChatbot {
            constructor() {
                this.apiBase = 'http://localhost:5001/api';
                this.authToken = null;
                this.sessionId = 'test_' + Date.now();
                this.isAuthenticated = false;
                this.init();
            }

            async init() {
                await this.authenticateGuest();
            }

            async authenticateGuest() {
                try {
                    const response = await fetch(`${this.apiBase}/auth/guest-token`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: this.sessionId })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        this.authToken = data.token;
                        this.isAuthenticated = true;
                        this.updateStatus('✅ Connected to AI platform');
                    } else {
                        this.updateStatus('❌ Failed to connect');
                    }
                } catch (error) {
                    this.updateStatus('❌ Connection error');
                }
            }

            async sendMessage(message) {
                if (!message.trim()) return;

                this.addMessage('user', message);
                this.updateStatus('🤖 AI Support Agent is thinking...');

                try {
                    // Use the new customer support agent endpoint
                    const response = await fetch(`${this.apiBase}/support/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.authToken}`
                        },
                        body: JSON.stringify({
                            message: message,
                            session_id: this.sessionId,
                            user_info: {
                                user_type: 'guest',
                                platform: 'web_chatbot'
                            }
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        
                        // Display the main response
                        this.addMessage('assistant', data.message);
                        
                        // Show suggested actions if available
                        if (data.suggested_actions && data.suggested_actions.length > 0) {
                            const actionsHtml = `
                                <div style="margin-top: 10px; padding: 8px; background: #e8f5e8; border-radius: 4px;">
                                    <strong>💡 Suggested actions:</strong><br>
                                    ${data.suggested_actions.map(action => `• ${action}`).join('<br>')}
                                </div>
                            `;
                            this.addMessage('assistant', actionsHtml);
                        }
                        
                        // Handle escalation if needed
                        if (data.escalation_needed) {
                            this.addMessage('assistant', '🔄 This issue may require technical assistance. Would you like me to escalate this to our technical team?');
                        }
                        
                        this.updateStatus('✅ Ready for next question');
                    } else {
                        // Fallback to documentation agent if support agent fails
                        await this.fallbackToDocumentationAgent(message);
                    }
                } catch (error) {
                    // Fallback to documentation agent on connection error
                    await this.fallbackToDocumentationAgent(message);
                }
            }

            async fallbackToDocumentationAgent(message) {
                try {
                    const response = await fetch(`${this.apiBase}/agents/documentation/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.authToken}`
                        },
                        body: JSON.stringify({
                            message: `You are an expert AI assistant for the Alpha 1 AI Platform. User question: "${message}". Provide a helpful, detailed response about our platform, agents, pricing, or features.`,
                            session_id: this.sessionId,
                            context: "test_chatbot_fallback"
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.addMessage('assistant', data.response);
                        this.updateStatus('✅ Ready for next question (using fallback agent)');
                    } else {
                        this.addMessage('assistant', '❌ Sorry, I encountered an error. Please try again or contact support.');
                        this.updateStatus('❌ Error occurred');
                    }
                } catch (error) {
                    this.addMessage('assistant', '❌ Connection error. Please check if the server is running.');
                    this.updateStatus('❌ Connection failed');
                }
            }

            addMessage(role, content) {
                const messagesDiv = document.getElementById('messages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                messageDiv.innerHTML = `<strong>${role === 'user' ? 'You' : 'AI Assistant'}:</strong><br>${content}`;
                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            updateStatus(status) {
                document.getElementById('status').textContent = status;
            }
        }

        const chatbot = new TestChatbot();

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            if (message.trim()) {
                chatbot.sendMessage(message);
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
